services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_FILE: /app/data/notes.json
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - notes-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  notes-data:
