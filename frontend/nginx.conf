server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    # TODO (lab block 1:35-2:00): this serves files by exact path only.
    # Open a note, then refresh the page, and read the nginx log.
    # One line fixes it - see the workshop notes on SPA routing.
    index index.html;
  }

  location /health {
    access_log off;
    return 200 "ok\n";
  }
}
